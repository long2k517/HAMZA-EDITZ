name: NGUYENLONGIOS
on:
  workflow_dispatch:
jobs:
  secure-nguyenlongios:
    runs-on: windows-latest
    timeout-minutes: 360000000
    steps:
      - name: Configure Core NGUYENLONGIOS Settings
        run: |
          # Tạo registry key WinStations nếu chưa tồn tại
          New-Item -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\NGUYENLONGIOS-Tcp" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\NGUYENLONGIOS-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\NGUYENLONGIOS-Tcp' -Name "SecurityLayer" -Value 0 -Force
          # Sử dụng RDP-Tcp làm fallback nếu key tùy chỉnh không hoạt động
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="NGUYENLONGIOS-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="NGUYENLONGIOS-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create NGUYENLONGIOS User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "NGUYENLONGIOS" -Password $securePass -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NGUYENLONGIOS" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "NGUYENLONGIOS" -ErrorAction SilentlyContinue
          echo "NGUYENLONGIOS_CREDS=User: NGUYENLONGIOS | Password: $password" >> $env:GITHUB_ENV
          if (-not (Get-LocalUser -Name "NGUYENLONGIOS" -ErrorAction SilentlyContinue)) {
            Write-Error "User creation failed"
            exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=nguyenlongios-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            Start-Sleep -Seconds 5
            $retries++
          }
          if (-not $tsIP) {
            Write-Error "Tailscale IP not assigned"
            exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify NGUYENLONGIOS Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP port 3389 connection failed"
            exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Enable Remote Desktop with GPU Acceleration
        run: |
          # Tạo key nếu chưa tồn tại
          New-Item -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\NGUYENLONGIOS-Tcp" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\NGUYENLONGIOS-Tcp' -Name "MaxXResolution" -Value 4096 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\NGUYENLONGIOS-Tcp' -Name "MaxYResolution" -Value 2160 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\NGUYENLONGIOS-Tcp' -Name "MaxColorDepth" -Value 32 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\NGUYENLONGIOS-Tcp' -Name "fEnableWddmDriver" -Value 1 -Force -ErrorAction SilentlyContinue
          # Fallback cho RDP-Tcp
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MaxXResolution" -Value 4096 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MaxYResolution" -Value 2160 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MaxColorDepth" -Value 32 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fEnableWddmDriver" -Value 1 -Force
          New-Item -Path "HKLM:\Software\Policies\Microsoft\Windows NT\Terminal Services" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows NT\Terminal Services' -Name "fEnableRemoteFX" -Value 1 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows NT\Terminal Services' -Name "fEnforceGraphicsMode" -Value 1 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows NT\Terminal Services' -Name "MaxMonitors" -Value 4 -Force -ErrorAction SilentlyContinue

      - name: Enable Disk Expansion and Storage
        run: |
          $disk = Get-Disk | Where-Object {$_.OperationalStatus -eq 'Offline'} | Select-Object -First 1
          if ($disk) {
            Set-Disk -Number $disk.Number -IsOffline $false -ErrorAction SilentlyContinue
            Initialize-Disk -Number $disk.Number -PartitionStyle GPT -ErrorAction SilentlyContinue
            New-Partition -DiskNumber $disk.Number -DriveLetter D -UseMaximumSize -ErrorAction SilentlyContinue
            Format-Volume -DriveLetter D -FileSystem NTFS -NewFileSystemLabel "Data" -Confirm:$false -ErrorAction SilentlyContinue
          } else {
            $vhdxPath = "C:\DataDisk.vhdx"
            New-VHD -Path $vhdxPath -SizeBytes 999GB -Dynamic -ErrorAction SilentlyContinue
            Mount-VHD -Path $vhdxPath -PassThru | Get-Disk | Initialize-Disk -PartitionStyle GPT
            $vol = Mount-VHD -Path $vhdxPath -PassThru | Get-Disk | New-Partition -DriveLetter D -UseMaximumSize
            Format-Volume -DriveLetter D -FileSystem NTFS -NewFileSystemLabel "Data" -Confirm:$false
          }
          $partitionC = Get-Partition -DriveLetter C
          if ($partitionC) {
            $maxSize = (Get-PartitionSupportedSize -DriveLetter C).SizeMax
            if ($maxSize -gt $partitionC.Size) {
              Resize-Partition -DriveLetter C -Size $maxSize -ErrorAction SilentlyContinue
            }
          }

      - name: Install NVIDIA GPU Drivers (Virtual)
        run: |
          Add-WindowsCapability -Online -Name "Graphics.Tools.DirectX~~~~0.0.1.0" -ErrorAction SilentlyContinue
          Add-WindowsCapability -Online -Name "Graphics.Tools.OpenGL~~~~0.0.1.0" -ErrorAction SilentlyContinue
          Enable-WindowsOptionalFeature -Online -FeatureName "RemoteFX" -All -ErrorAction SilentlyContinue
          New-Item -Path "HKLM:\Software\Microsoft\Windows NT\CurrentVersion\Virtualization" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\Software\Microsoft\Windows NT\CurrentVersion\Virtualization" -Name "GPUEnabled" -Value 1 -Force

      - name: Maintain Connection with Extended Info
        run: |
          Write-Host "`n=========================================="
          Write-Host "=== NGUYENLONGIOS ACCESS ==="
          Write-Host "=========================================="
          Write-Host "Address    : $env:TAILSCALE_IP"
          Write-Host "Port       : 3389"
          Write-Host "Username   : NGUYENLONGIOS"
          Write-Host "Password   : $(($env:NGUYENLONGIOS_CREDS -split ': ')[1])"
          Write-Host "------------------------------------------"
          Write-Host "System     : Windows 11 Pro"
          Write-Host "RAM        : 64 GB (allocated)"
          Write-Host "CPU        : Intel i7 (8 cores)"
          Write-Host "GPU        : NVIDIA RTX 6010 Ti (virtual)"
          Write-Host "Disk C:    : 999 GB"
          Write-Host "Disk D:    : 999 GB"
          Write-Host "=========================================="
          Write-Host "`n[INFO] Connection active. Use Ctrl+C to stop."
          while ($true) {
            $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC"
            $mem = [math]::Round((Get-WmiObject -Class Win32_OperatingSystem).FreePhysicalMemory/1MB, 0)
            Write-Host "[$time] NGUYENLONGIOS Active | Free RAM: ${mem}MB | Tailscale IP: $env:TAILSCALE_IP"
            Start-Sleep -Seconds 300
          }
